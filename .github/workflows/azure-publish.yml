name: Publish Azure images
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: azure-publish
    env:
      REGISTRY: ${{ vars.AZURE_REGISTRY_NAME }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build and publish commit images
        run: |
          set -euo pipefail
          : "${REGISTRY:?Set AZURE_REGISTRY_NAME on azure-publish}"
          : "${RESOURCE_GROUP:?Set AZURE_RESOURCE_GROUP on azure-publish}"
          az acr login --name "$REGISTRY" --resource-group "$RESOURCE_GROUP"
          server=$(az acr show --name "$REGISTRY" --resource-group "$RESOURCE_GROUP" --query loginServer --output tsv)
          tag="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          backend="$server/supportops/backend:$tag"
          frontend="$server/supportops/frontend:$tag"
          docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$backend" .
          docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$frontend" frontend
          docker push "$backend"
          docker push "$frontend"
          printf 'Image tag for Azure deployment: `%s`\n' "$tag" >> "$GITHUB_STEP_SUMMARY"
