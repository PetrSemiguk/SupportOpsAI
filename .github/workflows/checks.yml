name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: az bicep install --version v0.48.1
      - name: Compile Azure templates
        run: |
          for template in infra/*.bicep; do
            az bicep build --file "$template" --stdout > /dev/null
          done
      - run: bash -n infra/deploy.sh

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: supportops
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: supportops_ci_eval
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U supportops -d supportops_ci_eval"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://supportops:ci-only-password@localhost:5432/supportops_ci_eval
      TEST_DATABASE_URL: postgresql+psycopg://supportops:ci-only-password@localhost:5432/supportops_ci_eval
      EVAL_DATABASE_URL: postgresql+psycopg://supportops:ci-only-password@localhost:5432/supportops_ci_eval
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12.14"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check backend
      - run: uv run mypy
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run python -m supportops.worker --setup
      - run: uv run pytest
      - run: uv run python -m supportops.evaluate

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
