name: supportops-ai

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supportops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supportops-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-supportops}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    environment: &backend_environment
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-supportops}:${POSTGRES_PASSWORD:-supportops-local-only}@db:5432/${POSTGRES_DB:-supportops}
      DEMO_CUSTOMER_TOKENS: ${DEMO_CUSTOMER_TOKENS:-}
      DEMO_OPERATOR_TOKEN: ${DEMO_OPERATOR_TOKEN:-}
      N8N_COMPLETION_TOKEN: ${N8N_COMPLETION_TOKEN:-}
    command:
      - sh
      - -c
      - >-
        .venv/bin/alembic upgrade head
        && .venv/bin/python -m supportops.index_policies
        && .venv/bin/python -m supportops.worker --setup
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment: *backend_environment
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 12

  worker:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-supportops}:${POSTGRES_PASSWORD:-supportops-local-only}@db:5432/${POSTGRES_DB:-supportops}
    command: [".venv/bin/python", "-m", "supportops.worker"]
    restart: on-failure
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.46.6
    profiles: [automation]
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      GENERIC_TIMEZONE: Asia/Singapore
      WEBHOOK_URL: http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  n8n_data:
